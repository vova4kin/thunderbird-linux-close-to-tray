<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="options.css">
  <script src="../common/settings.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <p id="status" class="status" hidden></p>

    <fieldset>
      <legend data-i18n="optionsBehaviour"></legend>
      <label class="row">
        <input type="checkbox" data-setting="interceptClose">
        <span>
          <span data-i18n="optionInterceptClose"></span>
          <small data-i18n="optionInterceptCloseHint"></small>
        </span>
      </label>
      <label class="row">
        <input type="checkbox" data-setting="minimizeToTray">
        <span>
          <span data-i18n="optionMinimizeToTray"></span>
          <small data-i18n="optionMinimizeToTrayHint"></small>
        </span>
      </label>
      <label class="row">
        <input type="checkbox" data-setting="startInTray">
        <span data-i18n="optionStartInTray"></span>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="optionsUnread"></legend>
      <label class="row">
        <input type="checkbox" data-setting="showUnreadCount">
        <span data-i18n="optionShowUnreadCount"></span>
      </label>
      <div class="row select-row">
        <label for="unreadScope" data-i18n="optionUnreadScope"></label>
        <select id="unreadScope" data-setting="unreadScope">
          <option value="inbox" data-i18n="optionUnreadScopeInbox"></option>
          <option value="all" data-i18n="optionUnreadScopeAll"></option>
        </select>
      </div>
    </fieldset>

    <fieldset id="kwinSection" hidden>
      <legend data-i18n="kwinTitle"></legend>
      <p data-i18n="kwinIntro"></p>

      <h3 data-i18n="kwinImportTitle"></h3>
      <ol>
        <li>
          <span data-i18n="kwinImportStep1"></span>
          <button type="button" id="kwinDownload" data-i18n="kwinDownloadButton"></button>
        </li>
        <li>
          <span data-i18n="kwinImportStep2"></span>
          <span class="command-row">
            <code id="kwinCommand">systemsettings kcm_kwinrules</code>
            <button type="button" data-copy="kwinCommand" data-i18n="copyButton"></button>
          </span>
          <small data-i18n="kwinImportStep2Hint"></small>
        </li>
        <li data-i18n="kwinImportStep3"></li>
      </ol>

      <h3 data-i18n="kwinManualTitle"></h3>
      <p data-i18n="kwinManualIntro"></p>
      <table class="kwin-table">
        <tbody>
          <tr><th data-i18n="kwinFieldWindowClass"></th><td><span data-i18n="kwinMatchRegex"></span> <code id="kwinClass"></code></td></tr>
          <tr><th data-i18n="kwinFieldWindowTitle"></th><td><span data-i18n="kwinMatchRegex"></span> <code id="kwinTitleRegex"></code></td></tr>
          <tr><th data-i18n="kwinFieldWindowTypes"></th><td data-i18n="kwinValueNormalWindow"></td></tr>
          <tr><th data-i18n="kwinFieldPosition"></th><td data-i18n="kwinValueRemember"></td></tr>
        </tbody>
      </table>
      <small data-i18n="kwinLocaleHint"></small>

      <details>
        <summary data-i18n="kwinRuleTextTitle"></summary>
        <pre id="kwinRuleText"></pre>
        <button type="button" data-copy="kwinRuleText" data-i18n="copyButton"></button>
      </details>
    </fieldset>
  </main>
</body>
</html>
